<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Draft Showdown Mobile</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #121214; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 450px; height: 100vh; background: #1a1a1e; display: flex; flex-direction: column; position: relative; border-left: 1px solid #2a2a30; border-right: 1px solid #2a2a30; }
        .screen { display: none; flex-direction: column; height: 100%; padding: 20px; justify-content: center; align-items: center; }
        .screen.active { display: flex; }
        
        /* Typography & Utilities */
        h1 { color: #f39c12; margin-bottom: 10px; font-size: 28px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 85%; padding: 15px; border-radius: 8px; border: none; background: #2c2c35; color: #fff; margin-bottom: 15px; font-size: 16px; text-align: center; }
        button { width: 85%; padding: 15px; border-radius: 8px; border: none; background: #e67e22; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #d35400; }

        /* HUD Header */
        .hud { display: flex; justify-content: space-between; width: 100%; padding: 15px; background: #25252b; border-bottom: 2px solid #32323d; font-weight: bold; font-size: 14px; }
        .hp-bar { color: #e74c3c; }

        /* Grid Draft Options Layout */
        .draft-container { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; gap: 20px; }
        .card-option { background: #2d3436; border: 2px solid #e67e22; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transform: scale(1); transition: 0.2s; }
        .card-option:active { transform: scale(0.95); }
        .card-icon { font-size: 48px; margin-bottom: 10px; }
        .card-stats { font-size: 13px; color: #b2bec3; margin-top: 5px; }

        /* Arena Battle Log View viewport */
        .arena { flex: 1; width: 100%; overflow-y: auto; background: #111; border-radius: 8px; padding: 15px; margin: 15px 0; display: flex; flex-direction: column; gap: 8px; }
        .log-line { font-size: 14px; background: #222; padding: 8px; border-radius: 4px; border-left: 4px solid #e67e22; animation: slideIn 0.3s ease-out forwards; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .waiting-text { font-style: italic; color: #aaa; text-align: center; }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-lobby" class="screen active">
        <h1>Draft Showdown</h1>
        <input type="text" id="username-input" placeholder="Enter Nickname..." maxlength="12">
        <button id="join-btn">FIND MATCH</button>
        <p id="lobby-status" class="waiting-text" style="margin-top: 15px;"></p>
    </div>

    <div id="screen-game" class="screen" style="padding:0; justify-content: flex-start;">
        <div class="hud">
            <div id="hud-p1">You: <span class="hp-bar" id="p1-hp">♥♥♥</span></div>
            <div id="hud-round" style="color:#f1c40f">ROUND 1</div>
            <div id="hud-p2">Enemy: <span class="hp-bar" id="p2-hp">♥♥♥</span></div>
        </div>
        
        <div id="draft-view" style="width:100%; padding:20px; display:flex; flex-direction:column; flex:1;">
            <h3 style="text-align:center; margin-bottom:15px; color:#bdc3c7;">Pick Your Unit</h3>
            <div class="draft-container" id="options-box">
                </div>
            <p id="draft-waiting" class="waiting-text" style="display:none; margin-top:20px;">Waiting for opponent to select...</p>
        </div>

        <div id="battle-view" style="width:100%; padding:20px; display:none; flex-direction:column; flex:1;">
            <h3 style="text-align:center; color:#e74c3c;">COMBAT ACTION SHOWDOWN</h3>
            <div class="arena" id="arena-log">
                </div>
        </div>
    </div>
</div>

<script>
    // CRITICAL: Replace this string with your live Railway URL path.
    const SERVER_URL = "https://your-railway-backend-url.up.railway.app";
    const socket = io(SERVER_URL);

    let currentRoomId = null;
    let myId = null;

    // Elements
    const btnJoin = document.getElementById('join-btn');
    const inputUsername = document.getElementById('username-input');
    const lobbyStatus = document.getElementById('lobby-status');
    const screenLobby = document.getElementById('screen-lobby');
    const screenGame = document.getElementById('screen-game');
    
    btnJoin.addEventListener('click', () => {
        const name = inputUsername.value.trim();
        socket.emit('joinMatchmaking', name);
        btnJoin.disabled = true;
        lobbyStatus.innerText = "Finding an available challenger...";
    });

    socket.on('connect', () => { myId = socket.id; });

    socket.on('startDraftPhase', (data) => {
        currentRoomId = data.roomId;
        screenLobby.classList.remove('active');
        screenGame.classList.add('active');
        document.getElementById('draft-view').style.display = 'flex';
        document.getElementById('battle-view').style.display = 'none';
        document.getElementById('draft-waiting').style.display = 'none';
        
        document.getElementById('hud-round').innerText = `ROUND ${data.round}`;
        document.getElementById('p1-hp').innerText = "♥".repeat(data.p1.id === myId ? data.p1.hp : data.p2.hp);
        document.getElementById('p2-hp').innerText = "♥".repeat(data.p1.id === myId ? data.p2.hp : data.p1.hp);

        // Render card options selectively depending on which player assignment you are
        const optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = '';
        const myOptions = data.p1.id === myId ? data.options.p1Options : data.options.p2Options;

        myOptions.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card-option';
            cardEl.innerHTML = `
                <div class="card-icon">${card.icon}</div>
                <strong>${card.name}</strong>
                <div class="card-stats">HP: ${card.hp} | ATK: ${card.atk} | SPD: ${card.spd}</div>
            `;
            cardEl.addEventListener('click', () => {
                socket.emit('pickCard', { roomId: currentRoomId, cardId: card.id });
                optionsBox.innerHTML = '';
                document.getElementById('draft-waiting').style.display = 'block';
            });
            optionsBox.appendChild(cardEl);
        });
    });

    socket.on('playerPicked', (data) => {
        if(data.playerId === myId) {
            document.getElementById('draft-waiting').style.display = 'block';
        }
    });

    socket.on('battleResults', (data) => {
        document.getElementById('draft-view').style.display = 'none';
        document.getElementById('battle-view').style.display = 'flex';
        
        const arenaLog = document.getElementById('arena-log');
        arenaLog.innerHTML = '';

        // Animate combat frames step by step
        data.log.forEach((line, index) => {
            setTimeout(() => {
                const p = document.createElement('div');
                p.className = 'log-line';
                p.innerText = line.text;
                arenaLog.appendChild(p);
                arenaLog.scrollTop = arenaLog.scrollHeight;
            }, index * 600);
        });

        // Update health parameters at the completion of animation streams
        setTimeout(() => {
            document.getElementById('p1-hp').innerText = "♥".repeat(socket.id === myId ? data.p1Hp : data.p2Hp);
            document.getElementById('p2-hp').innerText = "♥".repeat(socket.id === myId ? data.p2Hp : data.p1Hp);
        }, data.log.length * 600);
    });

    socket.on('gameOver', (data) => {
        setTimeout(() => {
            alert(`MATCH OVER! Winner is: ${data.winner}`);
            window.location.reload();
        }, 4000);
    });
</script>
</body>
</html>
